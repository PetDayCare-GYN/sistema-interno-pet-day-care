name: Deploy para Cloudflare

# Publica automaticamente na Cloudflare a cada push na branch main.
# Também pode ser disparado manualmente na aba Actions (botão "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita dois deploys simultâneos; o mais recente cancela o anterior em andamento.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: '1'

      - name: Build do aplicativo
        run: npm run build

      - name: Publicar na Cloudflare (wrangler deploy)
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f27711aa4e90203ceffbae293de6d21f
